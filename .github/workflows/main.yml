name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Maven Build
        run: mvn install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

  Testing:
     
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Code checkout
        uses: actions/checkout@v6
      
      - name: Run tests on Main branches
        if: github.ref == 'refs/heads/main'
        run: mvn test
      
      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests & code analysis"

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Notify if build fails
        if: failure()
        run: echo "Build failed! Please check the logs for details."